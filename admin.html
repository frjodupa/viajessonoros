<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Admin</title>
<style>body{font-family:system-ui;background:#fafafa;padding:20px}.card{background:white;max-width:600px;margin:20px auto;padding:24px;border-radius:16px}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}button{padding:12px;border:0;border-radius:8px;width:100%}.black{background:black;color:white}.green{background:#00b894;color:white}</style>
</head>
<body>
<div id="login" class="card"><h2>🔒 Admin</h2><input id="pass" type="password" placeholder="feel2024"><button class="black" onclick="checkAuth()">Entrar</button></div>
<div id="panel" class="card" style="display:none"><h2>Nueva Experiencia</h2><form onsubmit="subirEvento(event)"><input id="titulo" required placeholder="Título"><input id="badge" placeholder="Badge"><input id="fecha" placeholder="Fecha"><input id="lugar" placeholder="Lugar"><textarea id="descripcion" rows="3" placeholder="Descripción"></textarea><input id="imagenFile" type="file" accept="image/*"><input id="imagenUrl" placeholder="o URL https://..."><button class="green" type="submit">Crear</button></form><hr><div id="lista"></div></div>
<script type="module" src="/src/admin.js"></script>
</body>
</html>
