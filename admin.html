<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Admin</title>
<style>body{font-family:system-ui;background:#fafafa;padding:20px}.card{background:white;max-width:600px;margin:20px auto;padding:24px;border-radius:16px}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}button{padding:12px;border:0;border-radius:8px;width:100%}.black{background:black;color:white}.green{background:#00b894;color:white}</style>
</head>
<body>
<form id="login" class="card" onsubmit="checkAuth(event)"><h2>🔒 Admin</h2><input id="email" type="email" value="info@viajessonoros.es" autocomplete="username" required><input id="pass" type="password" placeholder="Clave" autocomplete="current-password" required><button class="black" type="submit">Entrar</button><button type="button" onclick="solicitarRecuperacion()">He olvidado mi contraseña</button><p id="login-error" role="alert" style="display:none;color:#b42318"></p></form>
<div id="panel" class="card" style="display:none"><h2>Nueva Experiencia</h2><button class="black" type="button" onclick="cerrarSesion()">Cerrar sesión</button><form onsubmit="subirEvento(event)"><input id="titulo" required placeholder="Título"><input id="badge" placeholder="Badge"><input id="fecha" placeholder="Fecha"><input id="lugar" placeholder="Lugar"><textarea id="descripcion" rows="3" placeholder="Descripción"></textarea><input id="imagenFile" type="file" accept="image/*"><input id="imagenUrl" placeholder="o URL https://..."><button class="green" type="submit">Crear</button></form><hr><div id="lista"></div></div>
<script type="module" src="/src/admin.js"></script>
</body>
</html>
