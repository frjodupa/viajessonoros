<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Demo aislada · Panel de reservas</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20312f;background:#f5f3ee}
*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:20px}
header{margin-bottom:24px}.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#53776f}
h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:.3em 0}h2{font-size:1.15rem}
.notice{background:#fff2cf;border-radius:10px;padding:12px;margin:16px 0}
.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 18px #26312d0b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{background:#f4f7f5;padding:14px;border-radius:12px}
.metric strong{display:block;font-size:1.7rem}.metric span{font-size:.83rem}
progress{width:100%;height:16px;accent-color:#326b5a}
.booking{border-top:1px solid #e6e7e3;padding:14px 0}.booking:first-child{border:0}
.booking h3{font-size:1rem;margin:0 0 8px}.booking p{margin:0 0 10px}
button{min-height:44px;border:0;border-radius:10px;padding:10px 15px;background:#225e50;color:white;font:inherit;margin:3px 6px 3px 0}
button.secondary{background:#e8efed;color:#225e50}
button:disabled{opacity:.5}button:focus-visible{outline:3px solid #dc9f28}
#feedback{min-height:24px}small{color:#54645f}
@media(max-width:360px){main{padding:12px}.card{padding:14px}}
</style></head><body><main>
<header><div class="eyebrow">Viajes Sonoros · Prototipo local</div><h1>Gestión de asistentes</h1>
<p>Experiencia ficticia · 24 de octubre · Sala de pruebas</p></header>
<div class="notice"><strong>DEMOSTRACIÓN.</strong> Sin asistentes reales, sin conexión a Supabase/D1 y sin envío de WhatsApp.</div>
<section class="card" aria-labelledby="capacity-title"><h2 id="capacity-title">Ocupación</h2><p id="summary"></p>
<progress id="capacity" max="12" value="0" aria-label="Plazas confirmadas"></progress>
<div class="grid" id="metrics"></div><p id="minimum"></p></section>
<section class="card" aria-labelledby="bookings-title"><h2 id="bookings-title">Solicitudes de ejemplo</h2>
<div id="bookings"></div></section>
<p id="feedback" role="status" aria-live="polite"></p>
</main><script type="module">
import {buildAttendeeRows} from '../src/booking-attendee-list.js';
import {prepareBookingMessage} from '../src/booking-messages.js';
import {prepareManualBookingReply} from '../src/booking-manual-reply.js';
import {createDemoMobilePanel} from '../src/booking-mobile-demo-controller.js';
const event={title:'Viaje sonoro de demostración',date:'24/10/2026',time:'19:00',place:'Sala de pruebas'};
const root=document.getElementById('bookings'),feedback=document.getElementById('feedback');
let overview=null,busy=false;
const demo=createDemoMobilePanel({onState(state){
 busy=state.phase==='loading'||state.phase==='saving';
 if(state.phase==='ready')overview=state.overview;
 if(state.phase==='error')feedback.textContent=state.message;
 draw();
}});
function draw(){
 if(!overview)return;
 document.getElementById('summary').textContent=overview.confirmed+' de '+overview.capacity+' plazas confirmadas';
 const progress=document.getElementById('capacity');progress.max=overview.capacity;progress.value=overview.confirmed;
 document.getElementById('metrics').replaceChildren(...[
 ['Disponibles',overview.available],['Pendientes',overview.pending],
 ['Lista de espera',overview.waitlist],['Canceladas',overview.cancelled]
 ].map(([label,value])=>{
  const div=document.createElement('div');div.className='metric';
  const strong=document.createElement('strong');strong.textContent=String(value);
  const span=document.createElement('span');span.textContent=label;
  div.append(strong,span);return div;
 }));
 document.getElementById('minimum').textContent=overview.minimumReached?'Aforo mínimo alcanzado':'Faltan '+overview.missingMinimum+' plazas para el mínimo';
 root.replaceChildren(...buildAttendeeRows(demo.bookings()).map(row=>{
  const item=document.createElement('article');item.className='booking';
  const name=document.createElement('h3');name.textContent=row.id+' · '+row.label;
  const count=document.createElement('p');count.textContent=row.seats+' plaza(s)';
  item.append(name,count);
  for(const [label,allowed,action] of [['Confirmar',row.canConfirm,'confirm'],['Cancelar',row.canCancel,'cancel']]){
   if(!allowed)continue;
   const button=document.createElement('button');button.type='button';button.textContent=label;
   if(action==='cancel')button.className='secondary';
   button.disabled=busy;
   button.addEventListener('click',async()=>{
    feedback.textContent='';
    await demo.presenter.change(action,row.id);
   });
   item.append(button);
  }
  if(row.status==='pending'||row.status==='confirmed'){
   const reply=document.createElement('button');reply.type='button';reply.className='secondary';
   reply.textContent=row.status==='confirmed'?'Preparar confirmación WhatsApp':'Preparar aviso pendiente';
   reply.disabled=busy;
   reply.addEventListener('click',()=>{
    const decision=row.status==='confirmed'?'confirmed':'pending';
    const prepared=prepareManualBookingReply({
     event:{id:'DEMO-EVENT',titulo:event.title},
     reservation:{id:row.id,eventId:'DEMO-EVENT',name:'Participante ficticio',phone:'600000000',persisted:true,status:row.status},
     decision
    });
    feedback.textContent=prepared.text+' (DEMO: mensaje no enviado)';
   });
   item.append(reply);
  }
  if(row.status!=='waitlist'){
   const draft=document.createElement('button');draft.type='button';draft.className='secondary';draft.textContent='Ver borrador';
   draft.disabled=busy;
   draft.addEventListener('click',()=>{
    feedback.textContent=prepareBookingMessage({type:row.status,title:event.title,date:event.date,time:event.time,place:event.place,seats:row.seats});
   });
   item.append(draft);
  }
  return item;
 }));
}
demo.presenter.refresh();
</script></body></html>
