name: GITOP - Pruebas públicas Playwright (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar Playwright temporalmente
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Verificar páginas públicas (sin reservas)
        run: npx playwright test tests/gitop-public-smoke.spec.js --browser=chromium --reporter=line --workers=1
