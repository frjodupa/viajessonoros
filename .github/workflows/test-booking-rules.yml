name: Validate booking rules
on:
  pull_request:
    paths:
      - 'src/booking-rules.js'
      - 'scripts/test-booking-rules.mjs'
      - 'src/booking-store.js'
      - 'src/booking-admin-auth.js'
      - 'src/booking-supabase-auth.js'
      - 'src/booking-private-controller.js'
      - 'src/booking-http-handler.js'
      - 'src/booking-dashboard.js'
      - 'src/booking-messages.js'
      - 'src/booking-message-action.js'
      - 'src/booking-attendee-list.js'
      - 'src/booking-panel-client.js'
      - 'scripts/test-booking-panel-client.mjs'
      - 'scripts/test-booking-attendee-list.mjs'
      - 'scripts/test-booking-message-action.mjs'
      - 'scripts/test-booking-messages.mjs'
      - 'scripts/test-booking-dashboard.mjs'
      - 'scripts/test-booking-http-handler.mjs'
      - 'scripts/test-booking-private-controller.mjs'
      - 'scripts/test-booking-supabase-auth.mjs'
      - 'scripts/test-booking-admin-auth.mjs'
      - 'scripts/test-booking-store.mjs'
      - 'scripts/test-d1-reservation-sql.py'
      - 'migrations/d1/**'
      - '.github/workflows/test-booking-rules.yml'
  workflow_dispatch:
jobs:
  booking-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-booking-rules.mjs
      - run: node scripts/test-booking-store.mjs
      - run: node scripts/test-booking-admin-auth.mjs
      - run: node scripts/test-booking-supabase-auth.mjs
      - run: node scripts/test-booking-private-controller.mjs
      - run: node scripts/test-booking-http-handler.mjs
      - run: node scripts/test-booking-dashboard.mjs
      - run: node scripts/test-booking-messages.mjs
      - run: node scripts/test-booking-message-action.mjs
      - run: node scripts/test-booking-attendee-list.mjs
      - run: node scripts/test-booking-panel-client.mjs
      - name: Test SQLite/D1 capacity triggers
        run: python3 scripts/test-d1-reservation-sql.py
