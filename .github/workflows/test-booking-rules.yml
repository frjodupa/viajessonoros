name: Validate booking rules
on:
  pull_request:
    paths:
      - 'src/booking-rules.js'
      - 'src/booking-public-request.js'
      - 'scripts/test-booking-public-request.mjs'
      - 'scripts/test-booking-rules.mjs'
      - 'src/booking-store.js'
      - 'src/booking-admin-auth.js'
      - 'src/booking-supabase-auth.js'
      - 'src/booking-private-controller.js'
      - 'src/booking-http-handler.js'
      - 'src/booking-worker.js'
      - 'scripts/test-booking-worker.mjs'
      - 'scripts/test-booking-worker-security.mjs'
      - 'src/booking-dashboard.js'
      - 'src/booking-messages.js'
      - 'src/booking-message-action.js'
      - 'src/booking-attendee-list.js'
      - 'src/booking-panel-client.js'
      - 'src/booking-admin-session.js'
      - 'src/booking-admin-gateway.js'
      - 'src/booking-admin-panel.js'
      - 'src/booking-mobile-presenter.js'
      - 'src/booking-mobile-demo-controller.js'
      - 'src/booking-panel-mode.js'
      - 'scripts/test-booking-panel-mode.mjs'
      - 'scripts/test-booking-mobile-demo-controller.mjs'
      - 'scripts/test-booking-mobile-presenter.mjs'
      - 'demos/booking-admin-mobile.html'
      - 'demos/booking-customer-flow.html'
      - 'scripts/test-booking-customer-flow.mjs'
      - 'scripts/test-booking-mobile-demo.mjs'
      - 'scripts/test-booking-admin-panel.mjs'
      - 'scripts/test-booking-admin-gateway.mjs'
      - 'scripts/test-booking-admin-session.mjs'
      - 'scripts/test-booking-panel-client.mjs'
      - 'scripts/test-booking-lifecycle.mjs'
      - 'scripts/test-booking-attendee-list.mjs'
      - 'scripts/test-booking-message-action.mjs'
      - 'scripts/test-booking-messages.mjs'
      - 'scripts/test-booking-dashboard.mjs'
      - 'scripts/test-booking-http-handler.mjs'
      - 'scripts/test-booking-private-controller.mjs'
      - 'scripts/test-booking-supabase-auth.mjs'
      - 'scripts/test-booking-admin-auth.mjs'
      - 'scripts/test-booking-store.mjs'
      - 'scripts/test-d1-reservation-sql.py'
      - 'scripts/test-d1-concurrent-confirmation.py'
      - 'scripts/test-d1-wrangler-local.mjs'
      - 'tests/d1/**'
      - 'migrations/d1/**'
      - '.github/workflows/test-booking-rules.yml'
  workflow_dispatch:
jobs:
  booking-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-booking-rules.mjs
      - run: node scripts/test-booking-public-request.mjs
      - run: node scripts/test-booking-store.mjs
      - run: node scripts/test-booking-admin-auth.mjs
      - run: node scripts/test-booking-supabase-auth.mjs
      - run: node scripts/test-booking-private-controller.mjs
      - run: node scripts/test-booking-http-handler.mjs
      - run: node scripts/test-booking-worker.mjs
      - run: node scripts/test-booking-worker-security.mjs
      - run: node scripts/test-booking-dashboard.mjs
      - run: node scripts/test-booking-messages.mjs
      - run: node scripts/test-booking-message-action.mjs
      - run: node scripts/test-booking-attendee-list.mjs
      - run: node scripts/test-booking-panel-client.mjs
      - run: node scripts/test-booking-admin-session.mjs
      - run: node scripts/test-booking-admin-gateway.mjs
      - run: node scripts/test-booking-admin-panel.mjs
      - run: node scripts/test-booking-mobile-presenter.mjs
      - run: node scripts/test-booking-mobile-demo-controller.mjs
      - run: node scripts/test-booking-panel-mode.mjs
      - run: node scripts/test-booking-mobile-demo.mjs
      - run: node scripts/test-booking-customer-flow.mjs
      - run: node scripts/test-booking-lifecycle.mjs
      - name: Test SQLite/D1 capacity triggers
        run: python3 scripts/test-d1-reservation-sql.py
      - name: Test competing confirmations on SQLite
        run: python3 scripts/test-d1-concurrent-confirmation.py
      - name: Test Cloudflare D1 local with Wrangler
        run: node scripts/test-d1-wrangler-local.mjs
