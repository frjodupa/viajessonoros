name: Generar imagen social Domus
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-domus-social.py'
      - 'public/logo-oficial.png'
      - 'public/viajes-sonoros-social.jpg'
      - '.github/workflows/domus-social.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  imagen-domus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Generar imagen OG
        run: python scripts/generate-domus-social.py
      - name: Guardar imagen en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/talleres-domus/domus-social.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Generar imagen social Domus [skip ci]"
            git push
          fi
