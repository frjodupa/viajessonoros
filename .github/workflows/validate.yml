name: Validar proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar y compilar
        run: npm run build

      - name: Guardar web compilada para pruebas sin despliegue
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: viajessonoros-web-preview
          path: dist/
          retention-days: 7
          if-no-files-found: error
