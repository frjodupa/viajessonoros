<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservas Premium | Viajes Sonoros</title><meta name="robots" content="noindex,nofollow"><style>
:root{font-family:Montserrat,system-ui,sans-serif;color:#321b42;background:#faf7f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e7dfeb;padding:16px max(18px,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header img{width:100px}a{color:#5b3f98}main{max-width:1150px;margin:auto;padding:24px 16px 60px}h1{font:500 clamp(2.5rem,7vw,4.2rem) Georgia,serif;margin:8px 0}h2{margin:0 0 8px;font-size:1.18rem}.hint{color:#66566b;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:25px 0}.metric,.panel,.booking{background:#fff;border:1px solid #eadfea;border-radius:16px;padding:20px;box-shadow:0 5px 23px #321b420a}.metric strong{display:block;font-size:2rem;color:#5b3f98}.metric span{font-size:.88rem;color:#66566b}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}button,input,select{font:inherit;border-radius:10px;padding:11px 14px}button{border:0;background:#5b3f98;color:#fff;cursor:pointer}button.secondary{background:#eee7f3;color:#49335a}button:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #cdbdd2;background:white;min-width:0}.search{flex:1;min-width:160px}.bookings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.booking{display:flex;flex-direction:column;gap:9px}.booking-top{display:flex;justify-content:space-between;align-items:start;gap:10px}.booking h3{margin:0;font-size:1.06rem}.booking p{margin:0;color:#625469;font-size:.91rem}.pill{border-radius:999px;padding:5px 9px;font-size:.76rem;font-weight:700;background:#efe9f7;color:#5b3f98;white-space:nowrap}.pill.confirmada{background:#e2f5eb;color:#176c44}.pill.cancelada{background:#f7e6e6;color:#a33434}.booking-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}.booking-actions a{padding:10px 12px;text-decoration:none;border-radius:9px;background:#eee7f3;font-weight:650}.notice{border-left:4px solid #5b3f98;background:#f0eaf5;padding:14px;border-radius:9px;margin:20px 0;line-height:1.5}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.bookings{grid-template-columns:1fr}header img{width:80px}.metric{padding:14px}.metric strong{font-size:1.55rem}}@media(max-width:360px){.metrics{grid-template-columns:1fr}}
</style></head><body><header><img src="/logo-oficial.png" alt="Viajes Sonoros"><a href="/experiencias.html">← Volver a experiencias</a></header><main><div class="hint">ADMINISTRACIÓN · MÓDULO INDEPENDIENTE</div><h1>Reservas Premium</h1><p class="hint">Control de solicitudes, asistentes, aportaciones y preparación de aplazamientos.</p><div class="notice" id="notice">Cargando acceso seguro…</div><section class="metrics" aria-label="Resumen"><div class="metric"><strong id="m-confirmed">—</strong><span>Asistentes confirmados</span></div><div class="metric"><strong id="m-pending">—</strong><span>Plazas pendientes</span></div><div class="metric"><strong id="m-reservations">—</strong><span>Reservas activas</span></div><div class="metric"><strong id="m-amount">—</strong><span>Aportación prevista</span></div></section><section class="panel"><h2>Reservas y participantes</h2><div class="toolbar"><input id="search" class="search" placeholder="Buscar por nombre o teléfono" aria-label="Buscar reservas"><select id="event" aria-label="Experiencia"><option value="all">Todas las experiencias</option></select><select id="status" aria-label="Estado"><option value="all">Todos los estados</option><option value="pendiente">Pendientes</option><option value="confirmada">Confirmadas</option><option value="cancelada">Canceladas</option></select><button type="button" id="reload" class="secondary">Actualizar</button></div><div id="bookings" class="bookings" aria-live="polite"></div></section></main><script type="module">
import {supabase} from '/src/supabase.js';
const $=id=>document.getElementById(id);
let reservations=[],events=[];
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
const setText=(id,value)=>$(id).textContent=value;
async function load(){
 setText('notice','Consultando reservas…');
 const auth=await supabase.auth.getUser();
 if(auth.error||!auth.data?.user){setText('notice','Acceso restringido. Inicia sesión desde el administrador de experiencias.');return}
 const rows=[];
 for(let start=0;start<100000;start+=500){
  const {data,error}=await supabase.from('reservas_whatsapp').select('id,experiencia_id,nombre,telefono,plazas,importe_total,estado,pago_estado,created_at').order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+499);
  if(error)throw error;
  rows.push(...(data||[]));if(!data||data.length<500)break;
 }
 const {data:eventRows,error:eventError}=await supabase.from('experiencias').select('id,titulo,fecha,hora,lugar,precio,descripcion,aforo_maximo').order('fecha',{ascending:false});
 if(eventError)throw eventError;
 reservations=rows;events=eventRows||[];
 const old=$('event').value;$('event').replaceChildren(new Option('Todas las experiencias','all'),...events.map(e=>new Option(e.titulo+' · '+e.fecha,String(e.id))));$('event').value=[...$('event').options].some(o=>o.value===old)?old:'all';
 setText('notice','Vista de gestión segura. Los aplazamientos con aportación se habilitarán después de validar el registro contable y la transferencia de plazas. Por ahora se gestionan en el módulo existente.');
 render();
}
const bookingMessage=(row,ev,confirmed)=>{
 const date=String(ev?.fecha||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
 const formatted=date?date[3]+'-'+date[2]+'-'+date[1]:'Fecha por confirmar';
 const time=String(ev?.hora||'').slice(0,5);
 const lines=[
 confirmed?'✨ RESERVA CONFIRMADA · VIAJES SONOROS':'✨ SOLICITUD DE RESERVA · VIAJES SONOROS',
 '',
 'Hola, '+row.nombre+'.',
 confirmed?'Tu reserva está confirmada. Nos alegra compartir contigo esta experiencia de calma y escucha.':'Hemos recibido tu solicitud de reserva. Antes de confirmar tu plaza, necesitamos comprobar la disponibilidad y la aportación.',
 '',
 '🌿 '+(ev?.titulo||'Experiencia de Viajes Sonoros'),
 '📅 '+formatted+(time?' · '+time+' h':''),
 ev?.lugar?'📍 '+ev.lugar:'',
 '👥 Plazas: '+row.plazas,
 row.importe_total!=null?'🤍 Aportación prevista: '+money(Number(row.importe_total)):'',
 '',
 confirmed?'Tu plaza está reservada. Te esperamos para disfrutar de este encuentro.':'Cuando recibamos la aportación y comprobemos las plazas, te enviaremos la confirmación definitiva por WhatsApp.',
 '',
 'Meditar es pasar tiempo con tu alma.',
 'María de la Osa y José Duque · Viajes Sonoros'
 ];
 return lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
};
const openBookingWhatsApp=(row,ev,confirmed)=>{
 const digits=String(row.telefono||'').replace(/[^\d]/g,'');
 const phone=digits.length===9?'34'+digits:digits;
 if(phone.length<9||phone.length>15){alert('Comprueba el número de teléfono de esta reserva.');return}
 const text=bookingMessage(row,ev,confirmed);
 window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text),'_blank','noopener,noreferrer');
};
function render(){
 const term=$('search').value.trim().toLocaleLowerCase('es-ES'),eventId=$('event').value,status=$('status').value;
 const all=reservations.filter(r=>(eventId==='all'||String(r.experiencia_id)===eventId));
 const filtered=all.filter(r=>(status==='all'||r.estado===status)&&(!term||r.nombre.toLocaleLowerCase('es-ES').includes(term)||r.telefono.includes(term)));
 const active=all.filter(r=>r.estado!=='cancelada');
 setText('m-confirmed',String(active.filter(r=>r.estado==='confirmada').reduce((n,r)=>n+Number(r.plazas||0),0)));
 setText('m-pending',String(active.filter(r=>r.estado==='pendiente').reduce((n,r)=>n+Number(r.plazas||0),0)));
 setText('m-reservations',String(active.length));
 setText('m-amount',money(active.reduce((n,r)=>n+Number(r.importe_total||0),0)));
 $('bookings').replaceChildren(...filtered.map(row=>{
  const event=events.find(e=>String(e.id)===String(row.experiencia_id));
  const article=document.createElement('article');article.className='booking';
  const top=document.createElement('div');top.className='booking-top';
  const heading=document.createElement('h3');heading.textContent=row.nombre;
  const badge=document.createElement('span');badge.className='pill '+row.estado;badge.textContent=row.estado;
  top.append(heading,badge);
  const detail=document.createElement('p');detail.textContent=(event?.titulo||'Experiencia '+row.experiencia_id)+' · '+(event?.fecha||'');
  const info=document.createElement('p');info.textContent=row.plazas+' plazas · '+(row.importe_total==null?'Importe por revisar':money(Number(row.importe_total)));
  const buttons=document.createElement('div');buttons.className='booking-actions';
  const phone=document.createElement('a');phone.href='tel:'+row.telefono;phone.textContent='Llamar';
  const manage=document.createElement('a');manage.href='/experiencias.html';manage.textContent='Gestionar reserva';
  const request=document.createElement('button');request.type='button';request.textContent='WhatsApp · Solicitar confirmación';
 request.addEventListener('click',()=>openBookingWhatsApp(row,event,false));
 const confirmation=document.createElement('button');confirmation.type='button';confirmation.textContent='WhatsApp · Reserva confirmada';
 confirmation.disabled=row.estado!=='confirmada';
 confirmation.title=row.estado==='confirmada'?'Preparar mensaje confirmado':'Confirma primero la reserva desde el administrador';
 confirmation.addEventListener('click',()=>openBookingWhatsApp(row,event,true));
 buttons.append(phone,request,confirmation,manage);article.append(top,detail,info,buttons);return article;
 }));
 if(!filtered.length)setText('bookings','No hay reservas que coincidan con los filtros.');
}
for(const id of ['search','event','status'])$(id).addEventListener(id==='search'?'input':'change',render);
$('reload').addEventListener('click',()=>load().catch(e=>setText('notice','Error de carga: '+e.message)));
load().catch(e=>setText('notice','No se pudieron cargar las reservas: '+e.message));
</script></body></html>
