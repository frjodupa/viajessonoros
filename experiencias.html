<script type="module">
import { supabase } from '/src/supabase.js'
import { installExperienceDetail, linkifyBroadcastListMentions } from '/src/experience-detail.js'
const WHATSAPP='34610056859'
const STORAGE_BUCKET='eventos'
// FIX WHATSAPP: api.whatsapp.com funciona en localhost y en https
const whLink = (t)=>`https://api.whatsapp.com/send?phone=${WHATSAPP}&text=${encodeURIComponent(t)}`
const UPCOMING_DATES_MESSAGE='Hola, quiero apuntarme a la lista de difusión de Viajes Sonoros para recibir las próximas experiencias.'
const PASSWORD_RESET_REDIRECT='https://viajessonoros.es/reset-password.html'
const AUTH_CONNECTION_MESSAGE='No se pudo conectar con el servicio de acceso. Inténtalo de nuevo en unos minutos.'
const LOGO='/logo-oficial.png'
const TEMPLATES=[
  {titulo:'Viaje Sonoro · Un espacio para volver a ti',precio:'Aportación voluntaria',lugar:'Cáceres · Espacio por confirmar',descripcion:'Una experiencia colectiva de sonido, vibración y presencia creada para detener el ritmo, respirar y escuchar. Handpan, cuencos, gong, voz e instrumentos orgánicos te acompañarán en un recorrido de relajación profunda y conexión interior. No necesitas experiencia previa. Plazas limitadas para cuidar la calidad del encuentro.'},
  {titulo:'Sesión Privada · Sonido y presencia',precio:'Consultar disponibilidad',lugar:'Cáceres · Sesión con reserva previa',descripcion:'Una experiencia íntima y personalizada para una persona, pareja o pequeño grupo. La sesión se adapta al momento y al ritmo de quienes participan, creando un espacio de calma, escucha y conexión a través de la voz, el handpan, los cuencos y otras sonoridades acústicas.'},
  {titulo:'Concierto Meditativo · Paisajes del alma',precio:'Aportación voluntaria',lugar:'Cáceres · Espacio por confirmar',descripcion:'Un encuentro sonoro para escuchar con todos los sentidos. Voz, handpan, kora, cuencos, gong y texturas inspiradas en la naturaleza crean un paisaje envolvente que invita a la quietud, la contemplación y el disfrute consciente del presente.'},
]
let eventos=[], view='experiencias', user=null, editId=null, fileToUpload=null, imageDataUrl=null
const parseLocalDate=(value)=>{const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return match?new Date(Number(match[1]),Number(match[2])-1,Number(match[3])):null}
const formatDate=(value)=>{const date=parseLocalDate(value);return date?new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'long',year:'numeric'}).format(date):String(value||'')}
const formatTime=(value)=>{const match=String(value||'').match(/^(\d{2}):(\d{2})/);return match?`${match[1]}:${match[2]} h`:''}
const formatContribution=(value)=>{const text=String(value||'').trim();return text&&!/^aportaci[oó]n\b/i.test(text)&&!/^gratuito$/i.test(text)?`Aportación ${text}`:text}
const eventMeta=(ev)=>[formatDate(ev.fecha),formatTime(ev.hora),formatContribution(ev.precio)].filter(Boolean).join(' · ')
const isReservable=(ev,now=new Date())=>{const eventDate=parseLocalDate(ev.fecha);if(!eventDate)return true;const timeMatch=String(ev.hora||'').match(/^(\d{1,2}):(\d{2})/);if(timeMatch)eventDate.setHours(Number(timeMatch[1]),Number(timeMatch[2]),0,0);else eventDate.setHours(23,59,59,999);return eventDate>=now}
const escapeHTML=(value)=>String(value??'').replace(/[&<>'"]/g,(character)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]))
const safeEventId=(value)=>String(value??'').replace(/[^a-zA-Z0-9_-]/g,'')
const safeImageURL=(value)=>{try{const url=new URL(String(value||''),window.location.origin);return url.protocol==='https:'||(url.protocol==='http:'&&['localhost','127.0.0.1'].includes(url.hostname))?url.href:''}catch{return ''}}
const authErrorDetails=(error)=>({message:error?.message||'Error desconocido',status:error?.status||null,code:error?.code||null})
const isInvalidCredentials=(error)=>error?.code==='invalid_credentials'||error?.status===400&&/invalid login credentials/i.test(error?.message||'')
const isAuthConnectionError=(error)=>!error?.status||/failed to fetch|fetch failed|network|load failed/i.test(error?.message||'')

window.goInicio=()=>{ window.location.href='/' }
window.goExperiencias=()=>{ view='experiencias'; render() }
window.goAdmin=async()=>{ if(supabase){const {data}=await supabase.auth.getSession();user=data.session?.user||null} view=user?'admin-panel':'admin-login'; render() }
window.openWhatsAppGeneral=()=>{
  const txt='Hola! Quiero info general sobre Viajes Sonoros Feel. Mi nombre es:'
  window.open(whLink(txt),'_blank','noopener,noreferrer')
}
const getExperienceWhatsAppLink=(ev)=>{
  const txt=`Hola! Quiero reservar la experiencia "${ev.titulo}" del ${eventMeta(ev)} en ${ev.lugar||''}. ¿Queda plaza? Mi nombre es:`
  return whLink(txt)
}
window.reservarExperiencia=(id)=>{
  const ev=eventos.find(e=>e.id==id); if(!ev) return
  if(!isReservable(ev)) return
  // FIX: doble método por si el navegador bloquea window.open
  const url=getExperienceWhatsAppLink(ev)
  window.open(url,'_blank','noopener,noreferrer')
  setTimeout(()=>{ window.location.href=url },300)
}
const experienceDetail=installExperienceDetail({getExperiences:()=>eventos,getWhatsAppLink:getExperienceWhatsAppLink,isReservable})

const hasValidAdmin=async()=>{if(!supabase)return false;const {data,error}=await supabase.auth.getUser();user=error?null:data.user;return Boolean(user)}
window.loginAdmin=async()=>{const errorElement=document.getElementById('login-error');if(!supabase){errorElement.textContent='Supabase no está configurado.';errorElement.style.display='block';return}const email=document.getElementById('email-input')?.value.trim().toLowerCase();const password=document.getElementById('clave-input')?.value;try{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;view='admin-panel';render()}catch(error){console.error('Supabase login error',authErrorDetails(error));errorElement.textContent=isInvalidCredentials(error)?'Email o contraseña incorrectos.':AUTH_CONNECTION_MESSAGE;errorElement.style.display='block'}}
window.togglePasswordVisibility=()=>{const input=document.getElementById('clave-input');const button=document.getElementById('password-visibility-button');if(!input||!button)return;const willShow=input.type==='password';input.type=willShow?'text':'password';button.setAttribute('aria-label',willShow?'Ocultar contraseña':'Mostrar contraseña');button.setAttribute('aria-pressed',String(willShow))}
window.requestPasswordRecovery=async()=>{
  const email=document.getElementById('email-input')?.value.trim()||''
  const button=document.getElementById('recovery-button')
  const message=document.getElementById('recovery-message')
  const showMessage=(text,type='error')=>{message.textContent=text;message.className=`admin-recovery-message ${type}`}
  if(!email){showMessage('Introduce primero tu correo electrónico.');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showMessage('Introduce un correo electrónico válido.');return}
  button.disabled=true
  button.textContent='Enviando…'
  showMessage('','')
  try{
    if(!supabase)throw new Error('Servicio no disponible')
    const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:PASSWORD_RESET_REDIRECT})
    if(error)throw error
    showMessage('Te hemos enviado un enlace para restablecer tu contraseña. Revisa también la carpeta de correo no deseado.','success')
  }catch(error){
    console.error('Supabase password recovery error',authErrorDetails(error))
    const text=isAuthConnectionError(error)?AUTH_CONNECTION_MESSAGE:error?.status===429?'Se han realizado demasiados intentos. Espera unos minutos antes de volver a probar.':'No se pudo enviar el enlace. Comprueba la configuración de recuperación e inténtalo de nuevo.'
    showMessage(text)
  }finally{
    button.disabled=false
    button.textContent='¿Has olvidado tu contraseña?'
  }
}
window.logout=async()=>{if(supabase)await supabase.auth.signOut();user=null;view='admin-login';render()}
window.previewFile=(e)=>{ const f=e.target.files[0]; if(!f) return; fileToUpload=f; const r=new FileReader(); r.onload=ev=>{ imageDataUrl=ev.target.result; document.getElementById('img-prev').src=ev.target.result; document.getElementById('preview-img').style.display='block' }; r.readAsDataURL(f) }
window.cancelarEdicion=()=>{ editId=null; fileToUpload=null; imageDataUrl=null; ['f-titulo','f-fecha','f-hora','f-precio','f-lugar','f-desc','f-imagen'].forEach(id=>{const el=document.getElementById(id); if(el) el.value=''}); const estado=document.getElementById('f-publicado'); if(estado)estado.value='false'; const p=document.getElementById('preview-img'); if(p) p.style.display='none'; const error=document.getElementById('form-error'); if(error){error.textContent='';error.style.display='none'} }
window.usarPlantilla=(index)=>{const template=TEMPLATES[index];if(!template)return;window.cancelarEdicion();document.getElementById('f-titulo').value=template.titulo;document.getElementById('f-precio').value=template.precio;document.getElementById('f-lugar').value=template.lugar;document.getElementById('f-desc').value=template.descripcion;document.getElementById('f-publicado').value='false';document.getElementById('f-titulo').focus()}
window.guardarEvento=async()=>{
  if(!(await hasValidAdmin())){view='admin-login';render();return}
  const titulo=document.getElementById('f-titulo').value.trim()
  const fecha=document.getElementById('f-fecha').value
  const hora=document.getElementById('f-hora').value
  const precio=document.getElementById('f-precio').value.trim()
  const lugar=document.getElementById('f-lugar').value.trim()
  const descripcion=document.getElementById('f-desc').value.trim()
  const publicado=document.getElementById('f-publicado').value==='true'
  let imagen_url=document.getElementById('f-imagen').value.trim()
  const btn=document.getElementById('btn-guardar')
  const errorElement=document.getElementById('form-error')
  if(errorElement){errorElement.textContent='';errorElement.style.display='none'}
  if(!titulo){ alert('Pon título'); return }
  if(btn){ btn.textContent='Guardando...'; btn.disabled=true }
  try{
    if(fileToUpload){
      if(supabase){ const name=Date.now()+'_'+fileToUpload.name.replace(/\s+/g,'_'); const {error}=await supabase.storage.from(STORAGE_BUCKET).upload(name,fileToUpload); if(error) throw error; const {data}=supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name); if(!data?.publicUrl) throw new Error('No se pudo obtener la URL pública de la imagen.'); imagen_url=data.publicUrl }
      else if(imageDataUrl){ imagen_url=imageDataUrl }
    }
    const payload={titulo,fecha,hora:hora||null,precio,lugar,descripcion,imagen_url:imagen_url||null,publicado}
    const result=editId?await supabase.from('experiencias').update(payload).eq('id',editId):await supabase.from('experiencias').insert(payload)
    if(result.error) throw result.error
    window.cancelarEdicion(); alert('¡Experiencia guardada!'); view='experiencias'; render()
  }catch(err){ if(errorElement){errorElement.textContent='No se pudo guardar: '+err.message;errorElement.style.display='block'} } finally{ if(btn){ btn.textContent='Guardar experiencia'; btn.disabled=false } }
}
window.editarEvento=async(id)=>{ if(!(await hasValidAdmin())){view='admin-login';render();return} const ev=eventos.find(e=>e.id==id); if(!ev) return; editId=id; document.getElementById('f-titulo').value=ev.titulo||''; document.getElementById('f-fecha').value=ev.fecha||''; document.getElementById('f-hora').value=String(ev.hora||'').slice(0,5); document.getElementById('f-precio').value=ev.precio||''; document.getElementById('f-lugar').value=ev.lugar||''; document.getElementById('f-desc').value=ev.descripcion||''; document.getElementById('f-imagen').value=ev.imagen_url||''; document.getElementById('f-publicado').value=String(ev.publicado===true); if(ev.imagen_url){document.getElementById('img-prev').src=ev.imagen_url;document.getElementById('preview-img').style.display='block'} imageDataUrl=ev.imagen_url||null; window.scrollTo({top:0,behavior:'smooth'}) }
window.borrarEvento=async(id)=>{ if(!(await hasValidAdmin())){view='admin-login';render();return} if(!confirm('¿Borrar?')) return; const {error}=await supabase.from('experiencias').delete().eq('id',id); if(error){alert('Error: '+error.message);return} renderAdminList() }
window.renderAdminList=async()=>{ if(!(await hasValidAdmin())){view='admin-login';render();return} const r=await supabase.from('experiencias').select('*').order('fecha',{ascending:true}).order('hora',{ascending:true,nullsFirst:false});if(r.error)throw r.error;const data=r.data||[]; eventos=data; const c=document.getElementById('lista-admin'); if(!c) return; c.innerHTML=data.map(ev=>{const id=safeEventId(ev.id);const image=safeImageURL(ev.imagen_url);return `<div style="background:white;border-radius:16px;padding:14px;display:flex;gap:12px;border:1px solid #EDE8F3">${image?`<img src="${escapeHTML(image)}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px"/>`:''}<div style="flex:1"><strong style="color:#412A6B">${escapeHTML(ev.titulo)}</strong> <span style="display:inline-block;padding:2px 7px;border-radius:999px;background:${ev.publicado?'#DCFCE7':'#F5F0E8'};color:${ev.publicado?'#166534':'#6B5A78'};font-size:10px;font-weight:700">${ev.publicado?'Publicada':'Borrador'}</span><br/><small style="color:#8A7AA8">${escapeHTML(eventMeta(ev))}</small></div><button onclick="window.editarEvento('${id}')" style="background:#F5F0E8;border:none;padding:6px 10px;border-radius:8px;cursor:pointer">Editar</button><button onclick="window.borrarEvento('${id}')" style="background:#FEE2E2;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:#B42318">Borrar</button></div>`}).join('') }
