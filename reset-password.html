<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Actualizar contraseña | Viajes Sonoros</title>
    <style>
      :root {
        color: #412a6b;
        background: #fffbf7;
        font-family: system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(145deg, #fffbf7, #f5f0e8);
      }

      .card {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #ede8f3;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 50px rgba(65, 42, 107, 0.1);
      }

      h1 {
        margin: 0 0 10px;
        font-family: Georgia, serif;
        font-weight: 500;
      }

      p {
        color: #756889;
        line-height: 1.6;
      }

      label {
        display: block;
        margin-top: 18px;
        font-weight: 600;
      }

      input {
        width: 100%;
        margin-top: 7px;
        padding: 13px 15px;
        border: 1px solid #dcd3e8;
        border-radius: 12px;
        font: inherit;
      }

      input:focus {
        outline: 2px solid #c7a46a;
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 22px;
        padding: 13px 18px;
        border: 0;
        border-radius: 999px;
        color: white;
        background: #64257d;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #message {
        min-height: 24px;
        margin-bottom: 0;
      }

      .error {
        color: #b42318;
      }

      .success {
        color: #26734d;
      }
    </style>
    <link rel="stylesheet" href="/secondary.css" />
  </head>
  <body class="operational-page reset-page">
    <main class="card">
      <h1>Nueva contraseña</h1>
      <p id="intro">Validando el enlace de recuperación…</p>
      <form id="reset-form" hidden>
        <label>
          Nueva contraseña
          <input id="password" type="password" autocomplete="new-password" required />
        </label>
        <label>
          Confirmar contraseña
          <input id="password-confirmation" type="password" autocomplete="new-password" required />
        </label>
        <button id="submit-button" type="submit">Actualizar contraseña</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/reset-password.js"></script>
  </body>
</html>
